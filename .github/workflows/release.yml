name: Release

# Run from the Actions tab (Run workflow → enter a tag like v1.0.0) to build a signed or
# unsigned release APK and publish it as a GitHub release.
#
# Optional secrets for a signed build:
#   ANDROID_KEYSTORE       base64 of your keystore file
#   ANDROID_KEY_PASSWORD   keystore password
#   ANDROID_KEY_ALIAS      key alias
#   ANDROID_STORE_PASSWORD store password
# Without them the release APK is unsigned (debug-signed) and users may need to allow
# installs from unknown sources.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v1.0.0)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE != '' }}
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          echo "$KEYSTORE" | base64 --decode > $RUNNER_TEMP/keystore.jks
          echo "KEYSTORE_PATH=$RUNNER_TEMP/keystore.jks" >> $GITHUB_ENV

      - name: Assemble release APK
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare release assets
        run: |
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          if [ ! -f "$APK" ]; then
            APK=app/build/outputs/apk/release/app-release.apk
          fi
          cp "$APK" "unadly-${{ inputs.tag }}.apk"
          sha256sum "unadly-${{ inputs.tag }}.apk" > SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            unadly-${{ inputs.tag }}.apk
            SHA256SUMS.txt
          tag_name: ${{ inputs.tag }}
          generate_release_notes: true
